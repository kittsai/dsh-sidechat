# The dsh-sidechat bundle: mount the side-chat plugin rows over an existing
# profile (typically web-app). Both rows are additive: the host `sidechat`
# service and the browser plugin roster entry.

- insert:
    - id: sidechat
      name: '@deepseek-ai/dsh-sidechat'

    - id: sidechat-ui
      name: '@deepseek-ai/dsh-client-sidechat'
